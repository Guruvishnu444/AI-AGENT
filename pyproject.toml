[project]
name = "vishnus-ultron"
version = "0.1.0"
description = "Vishnu's ULTRON — Advanced Private Voice AI Assistant & MCP Server"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "psutil",
    "python-dotenv",
]

[project.scripts]
ultron = "server:main"
ultron_voice = "agent_ultron:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py", "ultron"]
